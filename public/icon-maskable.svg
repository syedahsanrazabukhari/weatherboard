<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <radialGradient id="sunGlowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="sunGradM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="cloudGradM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="cloudShadowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGradM)" />

  <!-- Sun Glow -->
  <circle cx="316" cy="196" r="100" fill="url(#sunGlowM)" />

  <!-- Sun -->
  <circle cx="316" cy="196" r="60" fill="url(#sunGradM)" />

  <!-- Stylised Cloud Base inside safe zone -->
  <path
    filter="url(#cloudShadowM)"
    d="M 180 348 
       L 348 348 
       A 48 48 0 0 0 348 252 
       A 32 32 0 0 0 324 256 
       A 72 72 0 0 0 196 236 
       A 52 52 0 0 0 148 300 
       A 48 48 0 0 0 180 348 Z"
    fill="url(#cloudGradM)"
  />

  <circle cx="216" cy="380" r="4" fill="#38bdf8" opacity="0.8" />
  <circle cx="260" cy="392" r="4" fill="#38bdf8" opacity="0.6" />
  <circle cx="304" cy="380" r="4" fill="#38bdf8" opacity="0.8" />
</svg>
