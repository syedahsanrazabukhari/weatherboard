<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Sun Glow -->
  <circle cx="316" cy="196" r="120" fill="url(#sunGlow)" />

  <!-- Sun Rays / Primary Disk -->
  <circle cx="316" cy="196" r="70" fill="url(#sunGrad)" filter="url(#dropShadow)" />

  <!-- Stylised Cloud Base -->
  <path
    filter="url(#cloudShadow)"
    d="M 180 348 
       L 348 348 
       A 48 48 0 0 0 348 252 
       A 32 32 0 0 0 324 256 
       A 72 72 0 0 0 196 236 
       A 52 52 0 0 0 148 300 
       A 48 48 0 0 0 180 348 Z"
    fill="url(#cloudGrad)"
  />

  <!-- Subtle Weather Accent Dots -->
  <circle cx="216" cy="380" r="4" fill="#38bdf8" opacity="0.8" />
  <circle cx="260" cy="392" r="4" fill="#38bdf8" opacity="0.6" />
  <circle cx="304" cy="380" r="4" fill="#38bdf8" opacity="0.8" />
</svg>
